<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f9f9f9;
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #337ab7;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        #clear-cart-btn {
            margin: 20px;
            padding: 10px 20px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        #clear-cart-btn:hover {
            background-color: #c9302c;
        }
        .delete-btn {
            padding: 6px 12px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #d32f2f;
        }
        #home-btn {
            margin: 20px;
            padding: 10px 20px;
            background-color: #5bc0de;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        #home-btn:hover {
            background-color: #31b0d5;
        }
        #orders-btn {
            margin: 20px;
            padding: 10px 20px;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        #orders-btn {
            background-color: #5cb85c;
        }

        #orders-btn:hover {
            background-color: #449d44;
        }

    </style>
</head>
<body>

<h1>Список заказов
    <button id="clear-cart-btn">Очистить корзину</button>
    <button id="home-btn">На главную</button>
    <button id="orders-btn">Мои заказы</button>
</h1>

<table>
    <thead>
    <tr>
        <th>Модель</th>
        <th>Код</th>
        <th>Цена</th>
        <th>Удалить</th>
    </tr>
    </thead>
    <tbody id="cart-body">
    </tbody>
</table>

<button id="checkout-btn">
    Оформить заказ
</button>

<script>
    const cartBody = document.getElementById("cart-body");
    const token = localStorage.getItem('authToken');
     const username = localStorage.getItem('username');


    if (!token) {
        alert("Вы не авторизованы. Пожалуйста, войдите в систему.");
        window.location.href = "login.html";
    }


    fetch(`http://localhost:8080/customer/cart/user/${username}`,{
        headers: {
            method: 'GET',
            'Authorization': 'Bearer ' + token
        }
    } )
        .then(response => {
            if (!response.ok) {
                throw new Error("Ошибка загрузки корзины: " + response.status);
            }
            return response.json();
        })
        .then(data => {
            cartBody.innerHTML = "";
            data.forEach(item => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${item.model}</td>
                    <td>${item.code}</td>
                    <td>${item.price}</td>
                    <td>
                        <button
                            class="delete-btn"
                            data-cartid="${item.cartId}">
                            Удалить
                        </button>
                    </td>
                `;

                // 👉 переход по строке на карточку товара
                row.querySelectorAll('td:not(:last-child):not(:nth-child(6))').forEach(cell => {
                    cell.addEventListener('click', () => {
                        let url;
                        switch (item.type) {
                            case 'Laptop':
                                url = `customer-laptop.html?code=${item.code}`;
                                break;
                            case 'Printer':
                                url = `customer-printer.html?code=${item.code}`;
                                break;
                            case 'PC':
                                url = `customer-pc.html?code=${item.code}`;
                                break;
                            default:
                                console.warn("Неизвестный тип товара:", item.type);
                                return;
                        }
                        window.location.href = url;
                    });
                });

                // 👉 обработчик кнопки "Удалить"
                const deleteButton = row.querySelector('.delete-btn');
                deleteButton.addEventListener('click', (event) => {
                    event.stopPropagation(); // чтобы не срабатывал переход

                    const cartId =
                        deleteButton.getAttribute('data-cartId');

                    if (!cartId) {
                        alert("Ошибка: cartId отсутствует");
                        return;
                    }

                    if (confirm("Удалить этот товар из корзины?")) {
                        fetch(`http://localhost:8080/customer/cart/${cartId}`, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': 'Bearer ' + token
                            }
                        })
                            .then(response => {
                                if (response.ok) {
                                    console.log('Товар удалён');
                                    location.reload();
                                } else {
                                    return response.text().then(text => {
                                        console.error("Ошибка сервера:", text);
                                        throw new Error('Ошибка при удалении товара');
                                    });
                                }
                            })
                            .catch(error => {
                                console.error('Ошибка при удалении:', error);
                            });
                    }
                });

                cartBody.appendChild(row);
            });
        })
        .catch(error => {
            console.error("Ошибка:", error);
            cartBody.innerHTML = `<tr><td colspan="6">Ошибка загрузки корзины</td></tr>`;
        });


    document.getElementById('clear-cart-btn').addEventListener('click', () => {
        if (confirm("Вы уверены, что хотите очистить корзину?")) {

            fetch(`http://localhost:8080/customer/cart/user/${username}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            })
                .then(response => {
                    if (response.ok) {
                        console.log('Корзина очищена');
                        location.reload();
                    } else {
                        throw new Error('Ошибка при очистке корзины');
                    }
                })
                .catch(error => {
                    console.error('Ошибка при очистке корзины', error);
                });
        }
    });

    document.getElementById('home-btn').addEventListener('click', () => {
        window.location.href = "customer-index.html";
    });
    document.getElementById('orders-btn').addEventListener('click', () => {
        window.location.href = "customer-orders.html";
    });

    document
        .getElementById("checkout-btn")
        .addEventListener("click", () => {

            if (!confirm("Оформить заказ?")) {
                return;
            }

            fetch(
                `http://localhost:8080/customer/cart/user/${username}`,
                {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            )
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Ошибка оформления заказа");
                    }
                    return response.json();
                })
                .then(order => {

                    alert(
                        "Заказ №" +
                        order.orderId +
                        " успешно создан."
                    );

                    window.location.href =
                        "customer-orders.html";
                })
                .catch(error => {
                    console.error(error);
                    alert("Не удалось оформить заказ");
                });
        });
</script>

</body>
</html>
